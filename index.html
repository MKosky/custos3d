<!doctype html>
<!-- Minha Calculadora 3D: HTML + JavaScript, sem servidor. Os dados ficam no navegador de cada pessoa
     (SQLite via sql.js, guardado no IndexedDB). -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha Calculadora 3D</title>
    <meta name="description" content="Calcule o custo e o preço das suas impressões 3D a partir do .gcode.3mf e gere orçamentos em PDF com a sua marca." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23374151'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11zM7 11l9 5 9-5M16 16v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="estilo.css" />
    <script>
      // Tema salvo (js/tema.js grava aqui): aplicado antes de tudo para a página não piscar com a cor padrão
      try {
        const t = JSON.parse(localStorage.getItem("custos3d-tema"));
        const escuro = t.modo === "escuro" || (t.modo === "auto" && !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
        for (const [k, v] of Object.entries(escuro ? t.escuro : t.claro)) document.documentElement.style.setProperty("--" + k, v);
      } catch { /* primeira visita: cores padrão do estilo.css */ }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.15.2/dist/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.9/dist/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header>
      <!-- logo e nome da marca da pessoa (Minha marca), depois o nome do app -->
      <a class="marca" href="#/"><img id="logo-marca" alt="" hidden /><span id="nome-marca"></span><span class="app">Minha Calculadora 3D</span></a>
      <nav>
        <a href="#/">Início</a>
        <a href="#/orcamentos">Orçamentos</a>
        <a href="#/propostas">Propostas</a>
        <a href="#/vendas">Vendas</a>
        <a href="#/filamentos">Filamentos</a>
        <a href="#/parametros">Parâmetros</a>
        <a href="#/marca">Minha marca</a>
        <a href="#/backup">Exportar / importar</a>
      </nav>
    </header>
    <div id="aviso" role="status" aria-live="polite"></div>
    <main id="pagina"><p class="carregando">Carregando…</p></main>
  </body>
</html>
